name: "Build and validate dev container features"
on:
  pull_request:

jobs:
  validate-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Validate devcontainer-feature.json files"
        uses: devcontainers/action@1082abd5d2bf3a11abccba70eef98df068277772 # v1.4.3
        with:
          validate-only: "true"
          base-path-to-features: "./src"

  pre-commit-hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v3
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  update-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: "Checkout PR branch"
        uses: actions/checkout@v4
        with:
          # Check out the PR head branch (not the merge commit)
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: "Generate docs"
        uses: devcontainers/action@v1
        with:
          publish-features: "false"
          base-path-to-features: "./src"
          generate-docs: "true"
      - name: "Commit and push generated docs"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add */**/README.md
          git diff --staged --quiet || git commit -m "chore: auto-generate docs"
          git push
